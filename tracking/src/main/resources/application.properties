spring.application.name=tracking

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration (temporary - will be configured properly later)
spring.security.user.name=admin
spring.security.user.password=admin

# Google Sheets Configuration
google.sheets.enabled=false
google.sheets.credentials.path=src/main/resources/credentials.json
google.sheets.spreadsheet.id=${GOOGLE_SHEETS_SPREADSHEET_ID:}

# Async Configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# Retry Configuration
spring.retry.enabled=true
